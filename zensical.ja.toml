[project]
site_name = "Interactive Physics Atlas"
site_url = "https://d1ssk.github.io/interactive-physics-atlas/ja/"
site_description = "物理学と数学の概念を扱うインタラクティブなビジュアルアトラス。"
copyright = "Copyright &copy; 2026 Daichi Sasaki"
docs_dir = "build/docs-ja"
site_dir = "site/ja"
extra_css = ["stylesheets/palette.css", "stylesheets/extra.css"]
extra_javascript = [
    "javascripts/palette-favicon.js",
    "javascripts/visualization-frame-resizer.js",
    "javascripts/mathjax.js",
    "javascripts/mathjax-tex-svg.js",
]
nav = [
    { "ホーム" = "index.md" },
    { "古典力学" = "classical-mechanics/index.md" },
    { "電磁気学" = "electromagnetism/index.md" },
    { "量子力学" = "quantum-mechanics/index.md" },
    { "熱力学" = "thermodynamics/index.md" },
    { "統計物理学" = "statistical-physics/index.md" },
    { "物性物理学" = "condensed-matter-physics/index.md" },
    { "流体力学" = "fluid-mechanics/index.md" },
    { "相対論" = "relativity/index.md" },
    { "宇宙論" = "cosmology/index.md" },
    { "場の量子論" = "quantum-field-theory/index.md" },
    { "素粒子物理学" = "particle-physics/index.md" },
    { "超対称性" = "supersymmetry/index.md" },
    { "弦理論" = "string-theory/index.md" },
    { "物理数学" = "mathematics-for-physics/index.md" },
]

[project.theme]
favicon = "assets/images/favicon.svg"
custom_dir = "overrides"
language = "ja"

[project.extra]
locale = "ja"
home_name = "ホーム"
alternate_name = "English"
alternate_lang = "en"
alternate_base_url = "https://d1ssk.github.io/interactive-physics-atlas/"

[project.markdown_extensions]
pymdownx.arithmatex.generic = true

[project.plugins.macros.config]
module_name = "physics_atlas.docs_macros"
